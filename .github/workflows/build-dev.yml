name: Build Ragflow (arm64, development)

on:
  workflow_dispatch:
  push:
    branches: [ "development" ]

concurrency:
  group: build-dev-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native arm64 -> no QEMU. Free on public repos; uses plan minutes on private.
    # If your repo is private without arm64 minutes, point this at your GB10 box:
    #   runs-on: [self-hosted, linux, ARM64]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Dockerfile copies .git and runs `git describe --tags` for VERSION.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Upstream moved the deps subsystem into ragflow_deps/. The script writes its
      # artifacts next to itself, and that directory is now the deps build context.
      - name: Download deps
        working-directory: ragflow_deps
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub nltk
          python download_deps.py
          # Fail loudly if artifacts aren't in the context dir.
          ls -la cl100k_base.tiktoken libssl*.deb nltk_data huggingface.co

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # FROM scratch + COPY: just files, no execution. Tagged as the name the main
      # Dockerfile mounts; docker driver resolves it from the local store (no --pull).
      - name: Build ragflow_deps (local, arm64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f ragflow_deps/Dockerfile \
            -t infiniflow/ragflow_deps:latest \
            ragflow_deps --load

      - name: Build & push Ragflow (arm64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            -t eurodoc/medlibre-ragflow:dev \
            . --load
          docker push eurodoc/medlibre-ragflow:dev